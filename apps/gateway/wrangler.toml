name = "quotacarry-gateway"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
QC_V2_TOKENS_ENABLED = "0"
QC_V2_ROUTING_ENABLED = "0"
QC_INFERENCE_ENABLED = "1"
QC_CLAIMS_ENABLED = "1"
QC_POLICY_ID = "2"
QC_ORIGIN = "https://quotacarry-web.quotacarry.workers.dev"
GROQ_MODEL = "openai/gpt-oss-20b"

[[d1_databases]]
binding = "DB"
database_name = "quotacarry"
database_id = "d4f2630f-02b3-485a-b717-51433a2d0468"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]
